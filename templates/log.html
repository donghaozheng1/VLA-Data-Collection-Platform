{% extends "base.html" %}
{% block page_title %}系统日志{% endblock %}
{% block content %}
<div class="flex mb-12">
    <div><span class="text-muted">📜 平台真实操作审计（来自 audit_log）：任务、版本、质检、标注、复核、采集、训练</span></div>
    <div style="display:flex;gap:8px;align-items:center;">
        <select id="levelFilter" style="padding:6px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;">
            <option value="ALL">全部级别</option>
            <option value="INFO">INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
            <option value="DEBUG">DEBUG</option>
        </select>
        <select id="moduleFilter" style="padding:6px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;">
            <option value="ALL">全部模块</option>
        </select>
        <button id="refreshBtn" class="btn btn-primary">🔄 刷新</button>
    </div>
</div>

<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px;">
    <div class="card" style="text-align:center;padding:20px;margin-bottom:0;">
        <div id="statTotal" style="font-size:26px;font-weight:700;color:#2b7de9;">-</div>
        <div class="text-muted">总日志数</div>
    </div>
    <div class="card" style="text-align:center;padding:20px;margin-bottom:0;">
        <div id="statToday" style="font-size:26px;font-weight:700;color:#1890ff;">-</div>
        <div class="text-muted">今日新增</div>
    </div>
    <div class="card" style="text-align:center;padding:20px;margin-bottom:0;">
        <div id="statError" style="font-size:26px;font-weight:700;color:#ff4d4f;">-</div>
        <div class="text-muted">ERROR</div>
    </div>
    <div class="card" style="text-align:center;padding:20px;margin-bottom:0;">
        <div id="statWarning" style="font-size:26px;font-weight:700;color:#faad14;">-</div>
        <div class="text-muted">WARNING</div>
    </div>
    <div class="card" style="text-align:center;padding:20px;margin-bottom:0;">
        <div id="statInfo" style="font-size:26px;font-weight:700;color:#52c41a;">-</div>
        <div class="text-muted">INFO</div>
    </div>
</div>

<div class="card">
    <div class="flex mb-12">
        <h3 style="margin-bottom:0;">📋 日志明细</h3>
        <span class="text-muted">当前显示 <strong id="shownCount">-</strong> 条 · 统计口径为全量日志</span>
    </div>
    <table class="table">
        <tr><th style="width:60px;">ID</th><th style="width:170px;">时间</th><th style="width:110px;">级别</th><th style="width:130px;">模块</th><th>内容</th></tr>
        <tbody id="logBody">
            <tr><td colspan="5" style="text-align:center;color:#999;padding:24px;">加载中...</td></tr>
        </tbody>
    </table>
</div>

<script>
const levelFilter = document.getElementById('levelFilter');
const moduleFilter = document.getElementById('moduleFilter');
const logBody = document.getElementById('logBody');
const shownCount = document.getElementById('shownCount');

const LEVEL_CLASS = {
    'ERROR': 'status-error',
    'WARNING': 'status-paused',
    'INFO': 'status-done',
    'DEBUG': 'status-offline'
};

function renderStats(stats) {
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statToday').textContent = stats.today;
    document.getElementById('statError').textContent = stats.error;
    document.getElementById('statWarning').textContent = stats.warning;
    document.getElementById('statInfo').textContent = stats.info;
}

function fillModules(modules) {
    if (moduleFilter.dataset.filled === '1') return;
    modules.forEach(function (m) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        moduleFilter.appendChild(opt);
    });
    moduleFilter.dataset.filled = '1';
}

function renderRows(logs) {
    if (!logs.length) {
        logBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:24px;">没有符合条件的日志</td></tr>';
        return;
    }
    logBody.innerHTML = logs.map(function (l) {
        const cls = LEVEL_CLASS[l.level] || 'status-offline';
        return '<tr>' +
            '<td>' + l.id + '</td>' +
            '<td style="font-size:13px;color:#666;">' + l.time + '</td>' +
            '<td><span class="status-badge ' + cls + '">' + l.level + '</span></td>' +
            '<td><span class="tag">' + l.module + '</span></td>' +
            '<td style="font-size:13px;">' + l.action + '</td>' +
            '</tr>';
    }).join('');
}

async function loadLogs() {
    const params = new URLSearchParams({
        level: levelFilter.value,
        module: moduleFilter.value,
        limit: '50'
    });
    logBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:24px;">加载中...</td></tr>';
    try {
        const resp = await fetch('/log/api/logs?' + params.toString());
        const json = await resp.json();
        fillModules(json.modules || []);
        renderStats(json.stats);
        renderRows(json.data);
        shownCount.textContent = json.total;
    } catch (err) {
        logBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4d4f;padding:24px;">加载失败：' + err + '</td></tr>';
    }
}

levelFilter.addEventListener('change', loadLogs);
moduleFilter.addEventListener('change', loadLogs);
document.getElementById('refreshBtn').addEventListener('click', loadLogs);

loadLogs();
</script>
{% endblock %}
